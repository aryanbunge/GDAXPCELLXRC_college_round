<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Handsfree Tracker</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:14px;min-height:100vh;color:#fff;font:500 15px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(60vmax 60vmax at 5% 0%,#1f6bff,transparent 60%),radial-gradient(60vmax 60vmax at 100% 20%,#9b4dff,transparent 60%),radial-gradient(60vmax 60vmax at 80% 100%,#ff3d7f,transparent 60%),#0c1233}
  video{width:100%;display:block;transform:scaleX(-1);background:#05070f;border-radius:26px;border:1px solid rgba(255,255,255,.28);box-shadow:0 18px 40px rgba(5,8,30,.5),inset 0 1px 0 rgba(255,255,255,.5)}
  #status{margin:12px 0 4px;padding:7px 14px;border-radius:999px;font-size:15px;font-weight:600;min-height:1.6em;width:max-content;max-width:100%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  #note,#heard{margin:4px 8px;font-size:13px;min-height:1.2em;color:rgba(235,235,245,.7)}
  button{min-height:44px;padding:0 20px;margin:8px 8px 0 0;color:#fff;font:600 15px -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;border:1px solid rgba(255,255,255,.35);border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,rgba(80,170,255,.95),rgba(10,132,255,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 22px rgba(10,132,255,.45);transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
  button:active:not(:disabled){transform:scale(.96)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.alt{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.10));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(5,8,30,.3)}
  :focus-visible{outline:3px solid #64d2ff;outline-offset:2px}
  p{font-weight:400;margin:10px 8px 0;font-size:12.5px;color:rgba(235,235,245,.65)}
</style></head>
<body>
  <video id="video" muted playsinline aria-label="Camera preview"></video>
  <div id="status" aria-live="polite">Press Start</div>
  <div id="note" aria-live="polite"></div>
  <div id="heard" aria-live="polite"></div>
  <button id="start">Start</button><button class="alt" id="cal">Calibrate</button><button class="alt" id="test">Test</button><button class="alt" id="setup">Settings</button>
  <p>Keep this window visible, for example snapped to a screen corner.</p>
  <script type="module" src="tracker.js"></script>
</body></html>
